name: Script request
description: Ask for a new script, or a change to an existing one.
title: "[Request]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the task or pain point, not the solution. For example, "We find out about full disks from the client, not from monitoring."
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: How will we know it's done?
      description: What should the script output or change when it works?
    validations:
      required: true
  - type: input
    id: script
    attributes:
      label: Existing script (if any)
      placeholder: Get-DiskSpaceReport.ps1
  - type: dropdown
    id: urgency
    attributes:
      label: How soon is this needed?
      options:
        - Nice to have
        - This month
        - Blocking client work
    validations:
      required: true
