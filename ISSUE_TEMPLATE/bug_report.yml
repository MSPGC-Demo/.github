name: Bug report
description: A script did something it shouldn't have, or didn't do something it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting this. The more detail you give, the faster it gets fixed.
  - type: input
    id: script
    attributes:
      label: Script name
      placeholder: Get-DiskSpaceReport.ps1
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or error
      description: Paste the script output or error message. It's formatted as code automatically.
      render: powershell
  - type: dropdown
    id: where
    attributes:
      label: Where did you run it?
      options:
        - RMM or automation tool
        - Interactive PowerShell session
        - Scheduled task
        - Other
    validations:
      required: true
